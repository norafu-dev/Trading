# Python 包、运行依赖、测试环境与 Ruff 检查配置；uv.lock 锁定解析结果。
[project]
name = "trading-ingestion"
version = "0.1.0"
description = "Discord message ingestion foundation for the trading MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "discord.py-self==2.1.0",
  "SQLAlchemy>=2.0.43,<2.1",
  "asyncpg>=0.30,<0.32",
  "alembic>=1.16.5,<2",
  "pydantic-settings>=2.10,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.2,<2", "ruff>=0.13,<1", "httpx>=0.28,<1"]

[build-system]
requires = ["setuptools>=80,<83"]
build-backend = "setuptools.build_meta"

[project.scripts]
trading = "trading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires the isolated PostgreSQL test service"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
